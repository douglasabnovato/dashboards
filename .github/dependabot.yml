# Atualizações semanais de versão (#24). npm e Maven: versão maior fica de fora (é migração, com issue própria).
# Os PRs do Dependabot vão para a main e rodam os jobs build e portal do CI; quem mescla é o responsável.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      portal:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java:
        patterns: ["*"]
  # Actions: versão maior (ex.: checkout v4 -> v5) vem num PR à parte, sem misturar com patch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-versao-maior:
        patterns: ["*"]
        update-types: ["major"]
