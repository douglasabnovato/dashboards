# Configuração da interface web. Em produção, defina DASHBOARDS_API_URL, DASHBOARDS_API_KEY,
# KANBAN_USUARIO e KANBAN_SENHA como variáveis de ambiente (nunca neste arquivo)
spring.application.name=dashboards-web
server.port=${PORT:8080}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
joinfaces.faces.project-stage=Production
joinfaces.faces.state-saving-method=server
joinfaces.primefaces.font-awesome=false
management.endpoints.web.exposure.include=health
dashboards.api.base-url=${DASHBOARDS_API_URL:http://localhost:8081}
dashboards.api.key=${DASHBOARDS_API_KEY:}
dashboards.kanban.usuario=${KANBAN_USUARIO:admin}
dashboards.kanban.senha=${KANBAN_SENHA:}
# fim do arquivo
