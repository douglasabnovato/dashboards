# Configuração da API do learnTECH OS. Em produção, defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD e DASHBOARDS_API_KEY como variáveis de ambiente (nunca neste arquivo)
spring.application.name=dashboards-api
server.port=${PORT:8081}
spring.datasource.url=jdbc:h2:file:./data/dashboards;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
dashboards.api-key=${DASHBOARDS_API_KEY:}
dashboards.kanban.semana=${KANBAN_SEMANA:27-07-2026 a 31-07-2026}
# fim do arquivo
